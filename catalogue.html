---
layout: default
title: Catalogue
description: Tous les inserts J2S classés par ordre alphabétique.
---

{% assign sorted_products = site.products | sort: "title" %}
{% for product in sorted_products %}
  <article>
    <a href="{{ product.url | relative_url }}">
      {% if product.image %}
        <img src="{{ product.image | relative_url }}" alt="{{ product.title }}" width="200" height="200" loading="lazy">
      {% endif %}
      <h2>{{ product.title }}</h2>
    </a>
  </article>
{% endfor %}
