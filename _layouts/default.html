<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="site-body">
  <a class="visually-hidden-focusable position-absolute top-0 start-0 m-3 px-3 py-2 rounded bg-light text-dark" href="#main-content">
    Aller au contenu
  </a>

  <header class="border-bottom border-secondary-subtle sticky-top site-header">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ '/' | relative_url }}">
          <span class="brand-badge">J2S</span>
          <span>{{ site.title }}</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Ouvrir la navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Accueil</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/catalogue.html' %}active{% endif %}" href="{{ '/catalogue.html' | relative_url }}">Catalogue</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if page.url == '/a-propos.html' %}active{% endif %}" href="{{ '/a-propos.html' | relative_url }}">À propos</a>
            </li>
            <li class="nav-item mt-2 mt-lg-0">
              <a class="btn btn-primary rounded-pill px-4" href="{{ '/contact.html' | relative_url }}">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content" class="py-5">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="py-5 border-top border-secondary-subtle mt-5">
    <div class="container">
      <div class="row g-4 align-items-start">
        <div class="col-12 col-md-7">
          <p class="fw-semibold mb-2">{{ site.title }}</p>
          <p class="text-secondary mb-0">{{ site.description }}</p>
        </div>
        <div class="col-12 col-md-5">
          <ul class="list-unstyled d-flex flex-column gap-2 mb-0">
            <li><a class="footer-link" href="{{ '/' | relative_url }}">Accueil</a></li>
            <li><a class="footer-link" href="{{ '/catalogue.html' | relative_url }}">Catalogue</a></li>
            <li><a class="footer-link" href="{{ '/a-propos.html' | relative_url }}">À propos</a></li>
            <li><a class="footer-link" href="{{ '/contact.html' | relative_url }}">Contact</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
